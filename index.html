<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- GitHub Pages SPA restore (plan §15.2): 404.html rewrites deep links to
         /?/path?query — this snippet puts the clean URL back before the app boots. -->
    <script>
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, '', l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
    <title>Atlas — a personal travel atlas</title>
    <meta name="description" content="Atlas is a personal interactive travel map: drill from the world down to countries, regions, districts and upazilas; mark places visited, lived, in transit or on your wishlist; and watch your travel statistics grow." />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Atlas — a personal travel atlas" />
    <meta property="og:description" content="A hand-bound atlas, alive: an interactive personal travel map with hierarchical drill-down and visit marking." />
    <meta property="og:image" content="/og-map-card.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Atlas — a personal travel atlas" />
    <meta name="twitter:description" content="A hand-bound atlas, alive: an interactive personal travel map with hierarchical drill-down and visit marking." />
    <meta name="twitter:image" content="/og-map-card.png" />
    <meta name="theme-color" content="#F7F3EB" />

    <!-- Fonts: Fraunces (display), Inter (UI), IBM Plex Mono (data) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
